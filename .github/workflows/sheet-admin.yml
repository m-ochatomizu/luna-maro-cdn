name: Sheet admin (append/clear/list/used/show/approve/propose)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "append / clear / list / used / show / approve / propose"
        required: true
        default: "list"
      row_number:
        description: "action=clear のときのみ: クリアする行番号"
        required: false
      post_id:
        description: "action=approve/show のときのみ: 対象のpost_id"
        required: false
      approved_by:
        description: "action=approve のときのみ: 承認者表記(省略可)"
        required: false
      propose_json:
        description: >-
          action=propose のときのみ: 候補1件分のJSON(キー: id, date, time,
          account, image_ref, caption, hashtags, alt, notes(省略可))。
          Cowork側の投稿案生成タスクが呼ぶ想定。
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Write Google service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Write propose payload (action=propose のときのみ使う)
        if: github.event.inputs.action == 'propose'
        run: echo "$PROPOSE_JSON" > "$RUNNER_TEMP/propose.json"
        env:
          PROPOSE_JSON: ${{ github.event.inputs.propose_json }}

      - name: Run
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/sa.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          ACTION: ${{ github.event.inputs.action }}
          ROW_NUMBER: ${{ github.event.inputs.row_number }}
          POST_ID: ${{ github.event.inputs.post_id }}
          APPROVED_BY: ${{ github.event.inputs.approved_by }}
          PROPOSE_JSON_PATH: ${{ runner.temp }}/propose.json
        run: |
          case "$ACTION" in
            clear)
              python scripts/sheet_admin.py clear "$ROW_NUMBER"
              ;;
            list)
              python scripts/sheet_admin.py list
              ;;
            used)
              python scripts/sheet_admin.py used
              ;;
            show)
              python scripts/sheet_admin.py show "$POST_ID"
              ;;
            approve)
              if [ -n "$APPROVED_BY" ]; then
                python scripts/sheet_admin.py approve "$POST_ID" "$APPROVED_BY"
              else
                python scripts/sheet_admin.py approve "$POST_ID"
              fi
              ;;
            propose)
              python scripts/sheet_admin.py propose "$PROPOSE_JSON_PATH"
              ;;
            *)
              python scripts/sheet_admin.py append
              ;;
          esac
