name: Sheet admin (append/clear/clear_batch/list/used/show/dump/approve/approve_batch/propose)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "append / clear / clear_batch / list / used / show / dump / approve / approve_batch / propose"
        required: true
        default: "list"
      row_number:
        description: "action=clear のときのみ: クリアする行番号"
        required: false
      post_id:
        description: "action=approve/show のときのみ: 対象のpost_id"
        required: false
      approved_by:
        description: "action=approve のときのみ: 承認者表記(省略可)"
        required: false
      batch_json:
        description: >-
          action=propose/approve_batch/clear_batch のときのみ。
          propose: オブジェクトなら候補1件(id/date/time込み、手動テスト用)。配列なら
          内容だけの候補群(account, image_ref, caption, hashtags, alt, notes(省略可)。
          id/date/timeは自動採番)で、次の空き枠を順番に割り当てて追加する。
          approve_batch: {"post_ids": [...], "approved_by": "..."(省略可)}で複数件を
          まとめて承認する。
          clear_batch: {"row_numbers": [...]}で複数行をまとめてクリアする
          (propose直後の訂正・取り消し用)。
          いずれもCowork側は内容を決めるだけで、この呼び出し
          (Code側)がgit/GitHub操作を一手に担う。
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Write Google service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Write batch payload (action=propose/approve_batch/clear_batch のときのみ使う)
        if: github.event.inputs.action == 'propose' || github.event.inputs.action == 'approve_batch' || github.event.inputs.action == 'clear_batch'
        run: echo "$BATCH_JSON" > "$RUNNER_TEMP/batch.json"
        env:
          BATCH_JSON: ${{ github.event.inputs.batch_json }}

      - name: Run
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/sa.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          ACTION: ${{ github.event.inputs.action }}
          ROW_NUMBER: ${{ github.event.inputs.row_number }}
          POST_ID: ${{ github.event.inputs.post_id }}
          APPROVED_BY: ${{ github.event.inputs.approved_by }}
          BATCH_JSON_PATH: ${{ runner.temp }}/batch.json
        run: |
          case "$ACTION" in
            clear)
              python scripts/sheet_admin.py clear "$ROW_NUMBER"
              ;;
            list)
              python scripts/sheet_admin.py list
              ;;
            used)
              python scripts/sheet_admin.py used
              ;;
            show)
              python scripts/sheet_admin.py show "$POST_ID"
              ;;
            dump)
              python scripts/sheet_admin.py dump
              ;;
            approve)
              if [ -n "$APPROVED_BY" ]; then
                python scripts/sheet_admin.py approve "$POST_ID" "$APPROVED_BY"
              else
                python scripts/sheet_admin.py approve "$POST_ID"
              fi
              ;;
            propose)
              python scripts/sheet_admin.py propose "$BATCH_JSON_PATH"
              ;;
            approve_batch)
              python scripts/sheet_admin.py approve_batch "$BATCH_JSON_PATH"
              ;;
            clear_batch)
              python scripts/sheet_admin.py clear_batch "$BATCH_JSON_PATH"
              ;;
            *)
              python scripts/sheet_admin.py append
              ;;
          esac
