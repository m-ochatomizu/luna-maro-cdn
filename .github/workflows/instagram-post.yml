name: Instagram scheduled post

on:
  # 半兵衛の軍令により本番運用開始(2026-09-26)。旧Mac+launchdの投稿実行系
  # (com.creatorbrain.lunamaro.publish)は停止済み(2026-09-23)、最終確認
  # 6項目も点検済み(欠陥2点は修正・push済み)。火・金19:00 JST(=10:00 UTC)。
  schedule:
    - cron: "0 10 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると実際の投稿・シート更新は行わずログのみ出力する"
        required: false
        default: "false"

permissions:
  contents: write # このリポジトリ(CDN)への staging 画像コミット/削除用

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Write Google service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run scheduled posting
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/sa.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # 投稿カレンダーは1タブに通年分をまとめる設計のため必須指定
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }} # 例: m-ochatomizu/luna-maro
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          CDN_REPO: ${{ github.repository }}
          CDN_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 「ルナまろ」アカウント1つのみ。旧方式(ig_token.py)と同じ
          # Instagramログイン方式のトークン(graph.instagram.com)。
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_scheduled.py
